# Loaded on top of application.properties whenever no Spring profile is active,
# which is the case in tests. Tracked in git, unlike application.properties.

# Every cached test context shares one database and stays alive for the whole
# run, so a scheduled outbox dispatcher in any of them would send (and stamp)
# other tests' messages. Tests that need the jobs run them on their own thread
# and stop it afterwards (see LiveStreamIntegrationTest, LiveOrderUpdatesTest).
# Don't turn scheduling on in a test context.
app.live.scheduling-enabled=false
